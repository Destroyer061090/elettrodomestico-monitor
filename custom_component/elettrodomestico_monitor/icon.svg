<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2942;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0096c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48cae4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="256" y1="60" x2="256" y2="452" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>

  <!-- Appliance body (washing machine / dishwasher silhouette) -->
  <!-- Main body -->
  <rect x="120" y="140" width="220" height="240" rx="16" ry="16"
        fill="none" stroke="url(#teal)" stroke-width="8" opacity="0.9"/>

  <!-- Door circle -->
  <circle cx="230" cy="270" r="72" fill="none" stroke="url(#teal)" stroke-width="7" opacity="0.85"/>
  <circle cx="230" cy="270" r="52" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.4"/>
  <circle cx="230" cy="270" r="32" fill="#00d4ff" fill-opacity="0.12"/>

  <!-- Door inner highlight -->
  <path d="M215 250 Q230 235 245 250" stroke="#48cae4" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- Control panel top -->
  <rect x="130" y="148" width="200" height="36" rx="8" ry="8"
        fill="#00d4ff" fill-opacity="0.12"/>
  <!-- Control dots -->
  <circle cx="158" cy="166" r="8" fill="#00d4ff" opacity="0.8"/>
  <circle cx="182" cy="166" r="5" fill="#48cae4" opacity="0.6"/>
  <circle cx="200" cy="166" r="5" fill="#48cae4" opacity="0.6"/>
  <!-- Control bar -->
  <rect x="220" y="160" width="80" height="12" rx="6"
        fill="#48cae4" fill-opacity="0.4"/>

  <!-- Lightning bolt (energy) - right side -->
  <g filter="url(#glow)" transform="translate(358, 160)">
    <polygon points="30,0 12,42 26,42 0,84 44,30 28,30"
             fill="url(#accent)" opacity="0.95"/>
  </g>

  <!-- Energy bars / chart bottom right -->
  <g opacity="0.75" transform="translate(355, 290)">
    <rect x="0"  y="60" width="14" height="20" rx="3" fill="#00b4d8"/>
    <rect x="18" y="44" width="14" height="36" rx="3" fill="#00d4ff"/>
    <rect x="36" y="28" width="14" height="52" rx="3" fill="#48cae4"/>
    <rect x="54" y="36" width="14" height="44" rx="3" fill="#00d4ff"/>
    <!-- X axis -->
    <line x1="0" y1="82" x2="70" y2="82" stroke="#48cae4" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Wifi/signal arcs (smart home) top right -->
  <g transform="translate(400, 100)" opacity="0.6">
    <path d="M0 30 Q15 15 30 30" stroke="#48cae4" stroke-width="5"
          fill="none" stroke-linecap="round"/>
    <path d="M-10 45 Q15 15 40 45" stroke="#48cae4" stroke-width="4"
          fill="none" stroke-linecap="round" opacity="0.7"/>
    <circle cx="15" cy="52" r="5" fill="#00d4ff" opacity="0.9"/>
  </g>

  <!-- Bottom status bar -->
  <rect x="120" y="396" width="220" height="6" rx="3"
        fill="url(#teal)" opacity="0.5"/>
  <rect x="120" y="396" width="110" height="6" rx="3"
        fill="url(#teal)" opacity="0.9"/>
</svg>
