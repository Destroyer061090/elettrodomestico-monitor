name: Validate

# Gira su ogni push e ogni PR verso main, così un disallineamento come
# quello sistemato manualmente in v6.1.0 (manifest.json vs const.VERSION,
# header di file incoerenti) viene intercettato subito, non alla prossima
# revisione manuale.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest (validazione manifest / struttura integrazione)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validazione HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installa ruff
        run: pip install ruff
      - name: Esegui ruff check
        run: ruff check custom_components/elettrodomestico_monitor

  # Verifica automatica esattamente il tipo di disallineamento sistemato
  # manualmente in v6.1.0: manifest.json e const.VERSION devono coincidere.
  version-sync:
    name: Coerenza versione (manifest.json <-> const.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confronta manifest.json e const.VERSION
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/elettrodomestico_monitor/manifest.json'))['version'])")
          CONST_VERSION=$(python3 -c "
          import re
          src = open('custom_components/elettrodomestico_monitor/const.py').read()
          m = re.search(r'^VERSION\s*=\s*[\"\\']([^\"\\']+)[\"\\']', src, re.MULTILINE)
          print(m.group(1))
          ")
          echo "manifest.json: $MANIFEST_VERSION | const.py: $CONST_VERSION"
          if [ "$MANIFEST_VERSION" != "$CONST_VERSION" ]; then
            echo "::error::Versione disallineata: manifest.json=$MANIFEST_VERSION const.py=$CONST_VERSION"
            exit 1
          fi

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installa dipendenze di test
        run: pip install -r requirements_test.txt
      - name: Esegui pytest
        run: pytest tests/ -v
