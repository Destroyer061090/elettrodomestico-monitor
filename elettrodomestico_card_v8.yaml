##############################################################################
#  ELETTRODOMESTICO MONITOR — Lovelace Card v8
#  Versione: 4.33 — aggiornato automaticamente con il custom component
#  Supporta: elettrodomestici, vacuum (barra batteria invece di potenza)
#
#  Per cambiare device: cerca+sostituisci  _x1  con  _x2, _x8  ecc.
#  Per vacuum: cambia anche binary_sensor.ac_* con binary_sensor.ac_*
#
#  HACS: button-card · bar-card · paper-buttons-row · multiple-entity-row
#        mini-graph-card · swipe-card · browser_mod · card-mod
##############################################################################

type: entities
card_mod:
  style: |
    ha-card {
      --ha-card-border-width: 2px !important;
      --ha-card-border-color: rgba(0,212,255,0.35) !important;
      --ha-card-border-radius: 16px !important;
      --ha-card-box-shadow: 0 2px 12px rgba(0,0,0,0.35) !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: hidden !important;
      width: 100% !important;
    }
    .card-content { padding: 0 !important; }
    .card-header  { display: none !important; padding: 0 !important; }
    #states        { padding: 0 !important; }
    .section       { padding: 4px 16px 2px !important; margin: 0 !important; }
show_header_toggle: false
entities:

  # ── HEADER CLICCABILE ────────────────────────────────────────────────────
  # Apre il more-info dell'entità principale del device
  # Cambia entity in base al tipo:
  #   vacuum  → vacuum.elettrodomestici_x1
  #   clima   → climate.elettrodomestici_x1
  #   standard → switch.switch_elettrodomestici_x1
  - type: custom:button-card
    entity: switch.switch_elettrodomestici_x1
    name: Centro Controllo Lavastoviglie
    show_icon: false
    show_state: false
    show_name: true
    tap_action:
      action: more-info
    styles:
      card:
        - background: none
        - box-shadow: none
        - border-width: 0px
        - padding: 4px 16px 3px
        - height: auto
        - text-align: left
        - cursor: pointer
      name:
        - font-size: 11px
        - font-weight: 600
        - letter-spacing: 0.5px
        - text-transform: uppercase
        - color: var(--secondary-text-color)
        - justify-self: start

  - type: custom:hui-element
    card_type: vertical-stack
    cards:

      # ── RIGA PRINCIPALE ──────────────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: picture-entity
            entity: binary_sensor.ac_elettrodomestici_x1
            show_name: false
            show_state: false
            fit_mode: contain
            card_mod:
              style: |
                :host { flex: 0 0 40% !important; max-width: 40% !important; }
                ha-card {
                  --ha-card-border-width: 0px !important;
                  border-width: 0px !important;
                  padding: 8px; background: none; margin: 0;
                  height: 180px !important;
                }
            state_image:
              "on":  /local/foto-pkg/lavastoviglie_on.gif
              "off": /local/foto-pkg/lavastoviglie_off.png
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Ultimi 7 Giorni
                  style: |
                    --popup-background-color: var(--card-background-color);
                    --dialog-backdrop-filter: blur(2em) brightness(0.75);
                  content:
                    type: entities
                    card_mod:
                      style: |
                        ha-card { background: var(--card-background-color); }
                        .entities-row, .info, state-badge + div {
                          color: var(--primary-text-color) !important;
                        }
                    entities:
                      - type: divider
                      - entity: sensor.settimana_lunedi_elettrodomestici_x1
                        name: Lunedì
                        type: custom:multiple-entity-row
                        state_header: kWh
                        state_color: false
                        icon: mdi:calendar
                        entities:
                          - attribute: cicli
                            name: CICLI
                          - attribute: tempo
                            name: TEMPO
                          - attribute: costo_eur
                            name: EURO
                            unit: "€"
                      - type: divider
                      - entity: sensor.settimana_martedi_elettrodomestici_x1
                        name: Martedì
                        type: custom:multiple-entity-row
                        state_header: kWh
                        state_color: false
                        icon: mdi:calendar
                        entities:
                          - attribute: cicli
                            name: CICLI
                          - attribute: tempo
                            name: TEMPO
                          - attribute: costo_eur
                            name: EURO
                            unit: "€"
                      - type: divider
                      - entity: sensor.settimana_mercoledi_elettrodomestici_x1
                        name: Mercoledì
                        type: custom:multiple-entity-row
                        state_header: kWh
                        state_color: false
                        icon: mdi:calendar
                        entities:
                          - attribute: cicli
                            name: CICLI
                          - attribute: tempo
                            name: TEMPO
                          - attribute: costo_eur
                            name: EURO
                            unit: "€"
                      - type: divider
                      - entity: sensor.settimana_giovedi_elettrodomestici_x1
                        name: Giovedì
                        type: custom:multiple-entity-row
                        state_header: kWh
                        state_color: false
                        icon: mdi:calendar
                        entities:
                          - attribute: cicli
                            name: CICLI
                          - attribute: tempo
                            name: TEMPO
                          - attribute: costo_eur
                            name: EURO
                            unit: "€"
                      - type: divider
                      - entity: sensor.settimana_venerdi_elettrodomestici_x1
                        name: Venerdì
                        type: custom:multiple-entity-row
                        state_header: kWh
                        state_color: false
                        icon: mdi:calendar
                        entities:
                          - attribute: cicli
                            name: CICLI
                          - attribute: tempo
                            name: TEMPO
                          - attribute: costo_eur
                            name: EURO
                            unit: "€"
                      - type: divider
                      - entity: sensor.settimana_sabato_elettrodomestici_x1
                        name: Sabato
                        type: custom:multiple-entity-row
                        state_header: kWh
                        state_color: false
                        icon: mdi:calendar
                        entities:
                          - attribute: cicli
                            name: CICLI
                          - attribute: tempo
                            name: TEMPO
                          - attribute: costo_eur
                            name: EURO
                            unit: "€"
                      - type: divider
                      - entity: sensor.settimana_domenica_elettrodomestici_x1
                        name: Domenica
                        type: custom:multiple-entity-row
                        state_header: kWh
                        state_color: false
                        icon: mdi:calendar
                        entities:
                          - attribute: cicli
                            name: CICLI
                          - attribute: tempo
                            name: TEMPO
                          - attribute: costo_eur
                            name: EURO
                            unit: "€"
                      - type: divider

          - type: vertical-stack
            card_mod:
              style: |
                :host { flex: 0 0 60% !important; max-width: 60% !important; }
                ha-card {
                  height: 180px !important; overflow: hidden !important;
                  --ha-card-border-width: 0px !important;
                  box-shadow: none !important; background: none !important;
                }
            cards:
              - type: custom:button-card
                entity: binary_sensor.ac_elettrodomestici_x1
                icon: mdi:power
                tap_action:
                  action: more-info
                  entity: binary_sensor.ac_elettrodomestici_x1
                state_color: false
                show_name: false
                show_icon: true
                show_state: true
                show_label: true
                label: >
                  [[[return states['sensor.time_on_elettrodomestici_x1']?.attributes?.terminato??'—';]]]
                state_display: >
                  [[[return entity.state==='on'?'Stato':'Ultimo Avvio']]]
                styles:
                  grid:
                    - grid-template-areas: '"i s" "i l"'
                    - grid-template-columns: 44px auto
                  icon:
                    - color: var(--primary-text-color)
                    - height: 24px
                    - width: 24px
                    - padding: 0
                  state:
                    - padding: 0 8px
                    - justify-self: start
                    - color: var(--secondary-text-color)
                    - font-size: 11px
                    - font-weight: 600
                    - text-transform: uppercase
                    - letter-spacing: 0.4px
                  label:
                    - padding: 0 8px
                    - justify-self: start
                    - color: var(--primary-text-color)
                    - font-size: 12px
                    - font-weight: 500
                  card:
                    - background: none
                    - box-shadow: none
                    - border-width: 0px
                    - padding: 2px 0
                    - height: 42px

              - type: custom:button-card
                entity: binary_sensor.ac_elettrodomestici_x1
                state_color: false
                icon: mdi:history
                tap_action:
                  action: more-info
                  entity: sensor.ultimo_ciclo_elettrodomestici_x1
                show_name: false
                show_icon: true
                show_state: true
                show_label: true
                label: >
                  [[[return states['sensor.time_on_elettrodomestici_x1']?.attributes?.tempo_ciclo_elettrodomestici??'—';]]]
                state_display: >
                  [[[return entity.state==='on'?'Durata Ciclo':'Durata Ultimo']]]
                styles:
                  grid:
                    - grid-template-areas: '"i s" "i l"'
                    - grid-template-columns: 44px auto
                  icon:
                    - color: var(--primary-text-color)
                    - height: 24px
                    - width: 24px
                    - padding: 0
                  state:
                    - padding: 0 8px
                    - justify-self: start
                    - color: var(--secondary-text-color)
                    - font-size: 11px
                    - font-weight: 600
                    - text-transform: uppercase
                    - letter-spacing: 0.4px
                  label:
                    - padding: 0 8px
                    - justify-self: start
                    - color: var(--primary-text-color)
                    - font-size: 12px
                    - font-weight: 500
                  card:
                    - background: none
                    - box-shadow: none
                    - border-width: 0px
                    - padding: 2px 0
                    - height: 42px

              - type: custom:button-card
                entity: binary_sensor.ac_elettrodomestici_x1
                state_color: false
                icon: mdi:counter
                tap_action:
                  action: more-info
                  entity: sensor.ultimo_ciclo_elettrodomestici_x1
                show_name: false
                show_icon: true
                show_state: true
                show_label: true
                label: >
                  [[[return states['sensor.time_on_elettrodomestici_x1']?.attributes?.consumo_ciclo_elettrodomestici??'—';]]]
                state_display: >
                  [[[return entity.state==='on'?'Consumo ON':'Consumo Ultimo']]]
                styles:
                  grid:
                    - grid-template-areas: '"i s" "i l"'
                    - grid-template-columns: 44px auto
                  icon:
                    - color: var(--primary-text-color)
                    - height: 24px
                    - width: 24px
                    - padding: 0
                  state:
                    - padding: 0 8px
                    - justify-self: start
                    - color: var(--secondary-text-color)
                    - font-size: 11px
                    - font-weight: 600
                    - text-transform: uppercase
                    - letter-spacing: 0.4px
                  label:
                    - padding: 0 8px
                    - justify-self: start
                    - color: var(--primary-text-color)
                    - font-size: 12px
                    - font-weight: 500
                  card:
                    - background: none
                    - box-shadow: none
                    - border-width: 0px
                    - padding: 2px 0
                    - height: 42px

              - type: custom:button-card
                entity: binary_sensor.ac_elettrodomestici_x1
                tap_action:
                  action: more-info
                  entity: sensor.costo_oggi_elettrodomestici_x1
                state_color: false
                icon: mdi:currency-eur
                show_name: false
                show_icon: true
                show_state: true
                show_label: true
                label: >
                  [[[const v=states['sensor.time_on_elettrodomestici_x1']?.attributes?.costo_ciclo_elettrodomestici;return(v!==undefined&&v!==null)?v+' €':'—';]]]
                state_display: >
                  [[[return entity.state==='on'?'Costo Attuale':'Costo Ultimo']]]
                styles:
                  grid:
                    - grid-template-areas: '"i s" "i l"'
                    - grid-template-columns: 44px auto
                  icon:
                    - color: var(--primary-text-color)
                    - height: 24px
                    - width: 24px
                    - padding: 0
                  state:
                    - padding: 0 8px
                    - justify-self: start
                    - color: var(--secondary-text-color)
                    - font-size: 11px
                    - font-weight: 600
                    - text-transform: uppercase
                    - letter-spacing: 0.4px
                  label:
                    - padding: 0 8px
                    - justify-self: start
                    - color: var(--primary-text-color)
                    - font-size: 12px
                    - font-weight: 500
                  card:
                    - background: none
                    - box-shadow: none
                    - border-width: 0px
                    - padding: 2px 0
                    - height: 42px

      # ── BARRA POTENZA (elettrodomestico) ─────────────────────────────────
      # Per VACUUM: sostituisci con barra batteria (vedi commento sotto)
      - type: custom:bar-card
        entity: sensor.potenza_elettrodomestici_w_x1
        name: Consumo Istantaneo
        show_icon: true
        align: split
        columns: 1
        max: 2000
        positions:
          icon: inside
          indicator: inside
          name: inside
          value: inside
        unit_of_measurement: W
        severity:
          - color: "#1e90ff"
            from: 0
            to: 600
          - color: orange
            from: 601
            to: 1000
          - color: red
            from: 1001
            to: 4000
        card_mod:
          style: |
            ha-card {
              --ha-card-background: none;
              --ha-card-box-shadow: none;
              --ha-card-border-width: 0px;
            }
            bar-card-name, bar-card-value {
              color: var(--primary-text-color) !important;
            }

      # ── BARRA BATTERIA (solo per vacuum) ─────────────────────────────────
      # Decommentare e sostituire la barra potenza sopra per i vacuum:
      #- type: custom:bar-card
      #  entity: sensor.batteria_vacuum_x1
      #  name: Batteria
      #  show_icon: true
      #  align: split
      #  columns: 1
      #  max: 100
      #  positions:
      #    icon: inside
      #    indicator: inside
      #    name: inside
      #    value: inside
      #  unit_of_measurement: "%"
      #  severity:
      #    - color: red
      #      from: 0
      #      to: 25
      #    - color: orange
      #      from: 26
      #      to: 75
      #    - color: green
      #      from: 76
      #      to: 100
      #  card_mod:
      #    style: |
      #      ha-card {
      #        --ha-card-background: none;
      #        --ha-card-box-shadow: none;
      #        --ha-card-border-width: 0px;
      #      }
      #      bar-card-name, bar-card-value {
      #        color: var(--primary-text-color) !important;
      #      }

      # ── NAV BAR ─────────────────────────────────────────────────────────
      - type: custom:paper-buttons-row
        base_config:
          styles:
            button:
              - color: var(--secondary-text-color)
            icon:
              - color: var(--secondary-text-color)
        buttons:

          # ⚙️ IMPOSTAZIONI
          - icon: hass:cog-outline
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Impostazioni
                  style: |
                    --popup-background-color: var(--card-background-color);
                    --dialog-backdrop-filter: blur(2em) brightness(0.75);
                  content:
                    type: entities
                    card_mod:
                      style: |
                        ha-card { background: var(--card-background-color); }
                        .entities-row, .info, hui-generic-entity-row,
                        state-badge + div {
                          color: var(--primary-text-color) !important;
                        }
                        .secondary { color: var(--secondary-text-color) !important; }
                    entities:
                      - type: divider
                      - entity: sensor.time
                        name: Orologio
                        icon: mdi:clock-outline
                      - type: divider
                      - entity: sensor.programma_elettrodomestici_x1
                        name: Fascia Oraria Notifiche
                        icon: mdi:timer-outline
                        type: custom:multiple-entity-row
                        state_header: SPEGNIMENTO
                        entities:
                          - entity: sensor.programma_elettrodomestici_x1
                            attribute: accensione
                            name: ACCENSIONE
                      - entity: switch.notifica_push_elettrodomestici_x1
                        name: Notifiche
                        icon: mdi:cellphone-message
                        type: custom:multiple-entity-row
                        state_header: PUSH
                        toggle: true
                        state_color: true
                        entities:
                          - entity: switch.notifica_google_elettrodomestici_x1
                            name: GOOGLE
                            toggle: true
                          - entity: switch.notifica_alexa_elettrodomestici_x1
                            name: ALEXA
                            toggle: true
                          - entity: switch.notifica_whatsapp_elettrodomestici_x1
                            name: WHATSAPP
                            toggle: true
                      - type: divider
                      - entity: binary_sensor.ac_elettrodomestici_x1
                        icon: mdi:flash
                        name: Energia
                        type: custom:multiple-entity-row
                        state_header: STATO
                        state_color: false
                        entities:
                          - entity: switch.switch_elettrodomestici_x1
                            name: SWITCH
                            toggle: true
                          - entity: number.soglia_lavoro_elettrodomestici_w_x1
                            name: SOGLIA
                          - entity: number.tempo_innesco_elettrodomestici_m_x1
                            name: DELAY OFF
                          - entity: number.avvio_ritardato_elettrodomestici_s_x1
                            name: DELAY ON
                      - type: divider
                      - entity: time.orario_accensione_elettrodomestici_x1
                        name: Accensione Auto
                        icon: mdi:clock-start
                      - entity: time.orario_spegnimento_elettrodomestici_x1
                        name: Spegnimento Auto
                        icon: mdi:clock-end
                      - type: divider
                      - entity: text.messaggio_elettrodomestico_x1
                        name: Nome
                        icon: mdi:rename
                        type: custom:multiple-entity-row
                        state_header: MESSAGGIO
                        entities:
                          - entity: text.nome_elettrodomestico_x1
                            name: ELETTRODOMESTICO
                      - type: divider
                      - entity: sensor.time_on_elettrodomestici_x1
                        attribute: ultimo_reset
                        name: Reset Contatori
                        icon: mdi:restart
                        type: custom:multiple-entity-row
                        state_header: ULTIMO RESET
                        state_color: false
                        entities:
                          - type: button
                            name: ESEGUI
                            icon: mdi:button-pointer
                            tap_action:
                              action: call-service
                              service: button.press
                              data:
                                entity_id: button.reset_contatori_elettrodomestici_x1
                      - type: divider
                      - entity: sensor.costo_energia_elettrodomestici_x1
                        name: Costo Energia
                        icon: mdi:currency-eur
                      - type: divider

          # 📊 STATISTICHE
          - icon: hass:chart-line
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Statistiche
                  style: |
                    --popup-background-color: var(--card-background-color);
                    --dialog-backdrop-filter: blur(2em) brightness(0.75);
                  content:
                    type: entities
                    card_mod:
                      style: |
                        ha-card { background: var(--card-background-color); }
                        .entities-row, .info, state-badge + div {
                          color: var(--primary-text-color) !important;
                        }
                        .secondary { color: var(--secondary-text-color) !important; }
                    show_header_toggle: false
                    entities:
                      - type: section
                        label: Elettrodomestico
                      - type: custom:hui-element
                        card_type: vertical-stack
                        cards:
                          - type: vertical-stack
                            cards:
                              - entity: sensor.time_on_elettrodomestici_x1
                                attribute: costo_ciclo_elettrodomestici
                                name: false
                                icon: mdi:power-plug
                                unit: "€"
                                type: custom:multiple-entity-row
                                state_header: EURO
                                state_color: true
                                entities:
                                  - entity: sensor.time_on_elettrodomestici_x1
                                    attribute: terminato
                                    name: STATO
                                  - entity: sensor.time_on_elettrodomestici_x1
                                    attribute: tempo_ciclo_elettrodomestici
                                    name: TEMPO
                                  - entity: sensor.time_on_elettrodomestici_x1
                                    attribute: consumo_ciclo_elettrodomestici
                                    name: CONSUMO
                              - type: custom:swipe-card
                                start_card: 0
                                parameters:
                                  roundLengths: true
                                  effect: coverflow
                                  speed: 650
                                  spaceBetween: 20
                                  threshold: 7
                                  coverflowEffect:
                                    rotate: 80
                                    depth: 300
                                cards:
                                  - type: entities
                                    card_mod:
                                      style: |
                                        ha-card {
                                          border-width: 0px !important;
                                          background: none;
                                        }
                                        .entities-row, .info {
                                          color: var(--primary-text-color) !important;
                                        }
                                    entities:
                                      - type: section
                                        label: Oggi
                                      - entity: sensor.time_on_elettrodomestici_x1
                                        attribute: costo_consumo_giornaliero_elettrodomestici
                                        unit: "€"
                                        name: false
                                        state_header: EURO
                                        icon: mdi:calendar
                                        state_color: true
                                        type: custom:multiple-entity-row
                                        entities:
                                          - entity: sensor.cicli_oggi_elettrodomestici_x1
                                            name: CICLI
                                          - entity: sensor.time_on_elettrodomestici_x1
                                            attribute: Oggi
                                            name: TEMPO
                                          - entity: sensor.energy_oggi_elettrodomestici_x1
                                            name: CONSUMO
                                      - type: section
                                        label: Mese
                                      - entity: sensor.time_on_elettrodomestici_x1
                                        attribute: costo_consumo_mensile_elettrodomestici
                                        unit: "€"
                                        name: false
                                        state_header: EURO
                                        icon: mdi:calendar-week-begin
                                        state_color: true
                                        type: custom:multiple-entity-row
                                        entities:
                                          - entity: sensor.cicli_mese_elettrodomestici_x1
                                            name: CICLI
                                          - entity: sensor.time_on_elettrodomestici_x1
                                            attribute: Mese
                                            name: TEMPO
                                          - entity: sensor.energy_mese_elettrodomestici_x1
                                            name: CONSUMO
                                      - type: section
                                        label: Anno
                                      - entity: sensor.time_on_elettrodomestici_x1
                                        attribute: costo_consumo_annuale_elettrodomestici
                                        unit: "€"
                                        name: false
                                        state_header: EURO
                                        icon: mdi:calendar-month
                                        state_color: true
                                        type: custom:multiple-entity-row
                                        entities:
                                          - entity: sensor.cicli_anno_elettrodomestici_x1
                                            name: CICLI
                                          - entity: sensor.time_on_elettrodomestici_x1
                                            attribute: Anno
                                            name: TEMPO
                                          - entity: sensor.energy_anno_elettrodomestici_x1
                                            name: CONSUMO
                                  - type: entities
                                    card_mod:
                                      style: |
                                        ha-card {
                                          border-width: 0px !important;
                                          background: none;
                                        }
                                        .entities-row, .info {
                                          color: var(--primary-text-color) !important;
                                        }
                                    entities:
                                      - type: section
                                        label: Ieri
                                      - entity: sensor.time_on_elettrodomestici_x1
                                        attribute: costo_consumo_ieri_elettrodomestici
                                        unit: "€"
                                        name: false
                                        icon: mdi:calendar
                                        state_header: EURO
                                        state_color: true
                                        type: custom:multiple-entity-row
                                        entities:
                                          - entity: sensor.cicli_oggi_elettrodomestici_x1
                                            attribute: last_period
                                            name: CICLI
                                          - entity: sensor.time_on_elettrodomestici_x1
                                            attribute: Ieri
                                            name: TEMPO
                                          - entity: sensor.energy_oggi_elettrodomestici_x1
                                            attribute: last_period
                                            unit: kWh
                                            name: CONSUMO
                                      - type: section
                                        label: Mese Precedente
